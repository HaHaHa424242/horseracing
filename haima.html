<title>海馬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  /* Layout: episode tabs, one 16:9 canvas stage, transport controls, then a result legend. */
  :root {
    --bg: #eceff3;
    --fg: #1b2430;
    --muted: #5a6776;
    --line: #cbd3dc;
    --panel: #ffffff;
    --accent: #d93a72;
    --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --fg: #e8edf2; --muted: #9aa7b5; --line: #2b343f; --panel: #1b222b; --accent: #ff7aa2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --fg: #e8edf2; --muted: #9aa7b5; --line: #2b343f; --panel: #1b222b; --accent: #ff7aa2;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 40px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { margin: 0; color: var(--accent); font-weight: 700; letter-spacing: .12em; font-size: 13px; }
  h1 { margin: 2px 0 0; font-size: clamp(26px, 5vw, 38px); font-weight: 900; line-height: 1.2; text-wrap: balance; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stage { border-radius: 10px; overflow: hidden; background: #0b1017; border: 1px solid var(--line); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  button {
    font: inherit; font-weight: 700; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; cursor: pointer; min-width: 84px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #play { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type="range"] { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 84px; text-align: right; }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
  .legend li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; font-weight: 700; }
  .legend .num { margin-left: auto; font-size: 22px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  .note { margin: 0; color: var(--muted); max-width: 65ch; }
</style>

<main class="wrap">
  <header>
    <p class="eyebrow">三支抽籤影片</p>
    <h1>終點攝影賽馬</h1>
  </header>

  <div class="tabs" id="tabs">
    <button type="button" data-ep="0" aria-pressed="true">海馬篇</button>
    <button type="button" data-ep="1" aria-pressed="false">二維馬篇</button>
    <button type="button" data-ep="2" aria-pressed="false">你快樂馬篇</button>
  </div>

  <div class="stage"><canvas id="stage" aria-label="卡通賽馬動畫，每支影片的結尾會揭曉一個數字"></canvas></div>

  <div class="bar">
    <button id="play" type="button">暫停</button>
    <button id="replay" type="button">重播</button>
    <input id="seek" type="range" min="0" max="2250" value="0" aria-label="播放進度">
    <span id="clock">0:00 / 0:22</span>
  </div>

  <ul class="legend">
    <li>海馬<span class="num">67</span></li>
    <li>二維馬<span class="num">17</span></li>
    <li>你快樂馬<span class="num">1</span></li>
  </ul>
  <p class="note">每種籤對應一支影片，結尾的數字就是結果。同一種籤的人看到同一支。</p>
</main>

<script>
(function () {
  var W = 1280, H = 720;
  var cv = document.getElementById('stage');
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');

  var FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  try {
    document.fonts.load('900 40px "Noto Sans TC"', '海馬二維馬你快樂嗎好不苦笑員工證緩衝廣告跳過驗證通過砰抽到號小');
    document.fonts.load('700 40px "Noto Sans TC"', '預備三匹馬並駕齊驅衝線裁判我來數掃一下肚子裡好像有東西跌倒了觀眾席請選出所有含有的圖片載入中你是機器人猶豫');
  } catch (e) {}

  var A = 1.6, B = 7.6;
  var START_X = 215, FINISH_X = 960, CELL = 6.6;
  var NOSEOFF = { normal: 94, grin: 97, sea: 51, pixel: 20 * CELL };

  var DEF = {
    sea:   { look: 'sea',   name: '海馬',   color: '#ff9f43', dark: '#d9741a', belly: '#ffe3a8', silk: '#0ea5e9', f: 1.3, a: 0.04, ph: 0.4 },
    pixel: { look: 'pixel', name: '二維馬', color: '#111111', dark: '#111111', silk: '#111111', f: 1.5, a: -0.04, ph: 1.9 },
    grin:  { look: 'grin',  name: '你快樂馬', color: '#f6c453', dark: '#c99530', mane: '#b8731d', silk: '#e5484d', f: 1.1, a: 0.045, ph: 3.2 }
  };
  var LANES = [[1.0, 470], [1.15, 560], [1.3, 650]];

  var EPS = [
    { key: 'sea', cast: ['pixel', 'grin', 'sea'], endP: [0.96, 0.8, 0.88], freeAt: 999, stopT: 4.6, spawnT: 6.2,
      refT: 6.0, bubble: '好香…', bubbleStart: 6.15, bubbleEnd: 8.2,
      num: '67', line: '（88 隻全部過線，21 隻被裁判吃掉）' },
    { key: 'pixel', cast: ['sea', 'grin', 'pixel'], endP: [0.97, 0.8, 0.9], freeAt: B, t1: 3.4, t2: 5.2,
      C: 9.8, D: 12.2, E: 13.8, G: 23.4, END: 26.9,
      refT: B + 0.3, bubble: '我來掃一下！', bubbleStart: B + 0.45, bubbleEnd: 10.7,
      num: '17', line: '（驗證通過，你是牛或馬）' },
    { key: 'grin', cast: ['sea', 'pixel', 'grin'], endP: [0.97, 0.82, 0.9], freeAt: B, V: 5.2, arrive: 7.2,
      C: 7.8, D: 9.0, G: 17.0, END: 20.5,
      refT: null, bubble: null,
      num: '1', line: '（毫不猶豫）' }
  ];

  var ep = EPS[0], horses = [];

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function eio(x) { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function eout(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
  function oback(x) { x = clamp(x, 0, 1); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

  function rrPath(c, x, y, w, h, r) {
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function rr(c, x, y, w, h, r) { c.beginPath(); rrPath(c, x, y, w, h, r); }

  function starShape(c, x, y, r) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r;
      if (i === 0) c.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
      else c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    c.closePath();
  }

  function prog(h, t) {
    var x = clamp((t - A) / (B - A), 0, 1);
    return h.endP * x + h.a * Math.sin(h.f * 6.2832 * x + h.ph) * Math.sin(Math.PI * x);
  }

  function pos(h, t) {
    var tt = Math.min(t, ep.freeAt), s = h.s, gy = h.gy;
    var hasStop = ep.stopT !== undefined;
    var stop = hasStop && tt >= ep.stopT;
    var te = hasStop ? Math.min(tt, ep.stopT) : tt;
    if (ep.key === 'pixel' && h.look === 'pixel' && te >= ep.t1 && te < ep.t2) te = ep.t1;
    var tq = h.look === 'pixel' ? Math.floor(te * 8) / 8 : te;
    var veer = ep.key === 'grin' && h.star;
    var racing = tt >= A && !stop && !(veer && tt >= ep.arrive);
    var p = 0;
    if (tt >= A) p = prog(h, tq);
    var nx = START_X + p * (FINISH_X - START_X);
    if (veer && tt >= ep.V) {
      var e0 = eio((tt - ep.V) / (ep.arrive - ep.V));
      nx = START_X + prog(h, ep.V) * (FINISH_X - START_X) + 50 * e0;
      s = h.s * (1 - 0.4 * e0);
      gy = h.gy - (h.gy - 352) * e0;
    }
    var gal = racing ? Math.max(0, tq - A) * 13 : 0.3 + 0.25 * Math.sin(tt * 4 + h.ph);
    var bob;
    if (h.look === 'sea') bob = (ep.key === 'sea' && stop) ? 0 : Math.sin(tt * 3 + h.ph) * 8;
    else if (h.look === 'pixel') bob = racing ? -(Math.floor(tt * 8) % 2) * 3 : 0;
    else bob = racing ? -Math.abs(Math.sin(gal * 0.5 + h.ph)) * 7 : Math.sin(tt * 5 + h.ph) * 1.5;
    var ox = nx - NOSEOFF[h.look] * s;
    var oy = h.look === 'sea' ? gy - 78 * s : (h.look === 'pixel' ? gy - 13 * CELL * s : gy - 72 * s);
    return { ox: ox, oy: oy, gal: gal, bob: bob, tt: tt, p: p, s: s, gy: gy, t: t };
  }

  function anchor(h, lx, ly, t) {
    var P = pos(h, t === undefined ? B : t);
    return { x: P.ox + lx * P.s, y: P.oy + P.bob + ly * P.s };
  }

  function build(i) {
    ep = EPS[i];
    horses = ep.cast.map(function (key, li) {
      var d = DEF[key], h = {};
      for (var k in d) h[k] = d[k];
      h.s = LANES[li][0]; h.gy = LANES[li][1]; h.star = (li === 2); h.endP = ep.endP[li];
      return h;
    });
    if (ep.key === 'sea') {
      var star = horses[2], P = pos(star, ep.stopT), s = P.s;
      ep.belly = { x: P.ox + 10 * s - 55.8 * s, y: P.gy - 20.9 * s };
      var r = rng(7), arr = [], n, idx = [], crossAll = 0;
      for (n = 0; n < 88; n++) {
        var t0 = ep.spawnT + n * 0.028;
        var Tf = 0.45 + r() * 0.3, vx = 60 + r() * 120, yg = 470 + r() * 190, Hh = 90 + r() * 80, vr = 320 + r() * 140;
        var xf = ep.belly.x + vx * Tf;
        var tc = xf >= FINISH_X ? t0 + Tf : t0 + Tf + (FINISH_X - xf) / vr;
        arr.push({ t0: t0, Tf: Tf, vx: vx, yg: yg, H: Hh, vr: vr, xf: xf, gx: 1010 + r() * 220, tc: tc, ph: r() * 6, eaten: false, te: 0 });
        idx.push(n);
        if (tc > crossAll) crossAll = tc;
      }
      for (n = idx.length - 1; n > 0; n--) { var j = Math.floor(r() * (n + 1)), tmp = idx[n]; idx[n] = idx[j]; idx[j] = tmp; }
      ep.crossAll = crossAll;
      ep.eatStart = crossAll + 2.6;
      for (n = 0; n < 21; n++) { var b0 = arr[idx[n]]; b0.eaten = true; b0.te = ep.eatStart + n * 0.18; }
      ep.eatEnd = ep.eatStart + 20 * 0.18 + 0.5;
      ep.babies = arr;
      ep.G = ep.eatEnd + 1.2;
      ep.END = ep.G + 3.5;
    }
  }

  function tag(c, name, x, y, w, silk) {
    c.fillStyle = '#fff';
    rr(c, x - w / 2, y - 12, w, 24, 6); c.fill();
    c.strokeStyle = silk; c.lineWidth = 2.5; c.stroke();
    c.fillStyle = '#1b2430';
    c.font = '900 ' + Math.min(15, (w - 10) / name.length) + 'px ' + FONT;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(name, x, y + 1);
  }

  // ---------- horse looks ----------
  function drawNormal(c, h, P, grin) {
    var gal = P.gal;
    c.lineCap = 'round'; c.lineJoin = 'round';
    function leg(hx, hy, offs, col) {
      var a1 = Math.sin(gal + offs) * 0.9;
      var a2 = -(0.7 + 0.6 * Math.sin(gal + offs + 1.5));
      var kx = hx + Math.sin(a1) * 30, ky = hy + Math.cos(a1) * 30;
      var fx = kx + Math.sin(a1 + a2) * 28, fy = ky + Math.cos(a1 + a2) * 28;
      c.strokeStyle = col; c.lineWidth = 11;
      c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
      c.fillStyle = '#3a2a22';
      c.beginPath(); c.arc(fx, fy, 6, 0, 6.3); c.fill();
    }
    leg(-30, 14, 0.6, h.dark);
    leg(30, 14, 3.4, h.dark);

    var sway = Math.sin(gal) * 10;
    c.strokeStyle = h.mane; c.lineWidth = 10;
    c.beginPath(); c.moveTo(-44, -8); c.quadraticCurveTo(-72, -14 + sway, -88, 10 + sway * 1.5); c.stroke();

    c.fillStyle = h.color;
    c.beginPath(); c.ellipse(0, 0, 48, 25, 0, 0, 6.3); c.fill();

    c.strokeStyle = h.color; c.lineWidth = 30;
    c.beginPath(); c.moveTo(26, -6); c.lineTo(58, -38); c.stroke();
    c.strokeStyle = h.mane; c.lineWidth = 9;
    c.beginPath(); c.moveTo(15, -17); c.lineTo(47, -49); c.stroke();

    c.save();
    c.translate(74, -42); c.rotate(0.55);
    c.fillStyle = h.color;
    c.beginPath(); c.ellipse(0, 0, grin ? 26 : 22, grin ? 15 : 12, 0, 0, 6.3); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.25)';
    c.beginPath(); c.ellipse(14, 2, 9, 8.5, 0, 0, 6.3); c.fill();
    if (grin) {
      c.fillStyle = '#5a0f20';
      c.beginPath(); c.moveTo(-14, 3); c.quadraticCurveTo(4, 27, 26, 0); c.quadraticCurveTo(6, 12, -14, 3); c.closePath(); c.fill();
      c.save(); c.translate(6, 11); c.rotate(Math.sin(P.t * 16 + h.ph) * 0.9);
      c.strokeStyle = '#ff7b9c'; c.lineWidth = 8; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 22); c.stroke();
      c.fillStyle = '#ff5f87'; c.beginPath(); c.ellipse(0, 24, 6, 5, 0, 0, 6.3); c.fill();
      c.restore();
      c.strokeStyle = '#fff'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(-12, 4); c.quadraticCurveTo(6, 13, 24, 1.5); c.stroke();
      c.fillStyle = 'rgba(255,90,110,0.55)';
      c.beginPath(); c.arc(-8, -4, 5, 0, 6.3); c.fill();
    } else {
      c.fillStyle = '#2b1b14';
      c.beginPath(); c.arc(18, -2, 2, 0, 6.3); c.fill();
    }
    c.restore();
    c.fillStyle = h.color;
    c.beginPath(); c.moveTo(63, -52); c.lineTo(65, -70); c.lineTo(73, -54); c.closePath(); c.fill();

    c.fillStyle = '#fff'; c.strokeStyle = '#2b1b14'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(76, -47, 6, 0, 6.3); c.fill(); c.stroke();
    c.fillStyle = '#111';
    c.beginPath(); c.arc(77.5 + Math.sin(gal) * 1.6, -46 + Math.cos(gal) * 1.6, 3, 0, 6.3); c.fill();

    c.fillStyle = h.silk;
    rr(c, -26, -20, 52, 22, 6); c.fill();

    c.strokeStyle = h.silk; c.lineWidth = 6;
    c.beginPath(); c.moveTo(6, -40); c.lineTo(44, -34); c.stroke();
    c.fillStyle = h.silk;
    rr(c, -12, -52, 24, 28, 7); c.fill();
    c.fillStyle = '#f2c9a0';
    c.beginPath(); c.arc(9, -60, 8, 0, 6.3); c.fill();
    c.fillStyle = h.silk;
    c.beginPath(); c.arc(9, -62, 9, Math.PI, 0); c.fill();

    leg(-30, 14, 0, h.color);
    leg(30, 14, 2.8, h.color);
  }

  function seaBody(c, tt, col, belly, fin, simple, ph) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    if (!simple) {
      for (var i = 0; i < 6; i++) {
        var q = (tt * 0.9 + i / 6) % 1;
        var bx = -34 - i * 7 + Math.sin(tt * 5 + i) * 4, by = -10 - q * 80;
        c.strokeStyle = 'rgba(255,255,255,' + (0.9 * (1 - q)).toFixed(2) + ')';
        c.lineWidth = 2;
        c.beginPath(); c.arc(bx, by, 3 + (i * 7) % 3, 0, 6.3); c.stroke();
      }
    }
    c.save(); c.translate(-12, -6); c.rotate(Math.sin(tt * 14) * 0.22);
    c.fillStyle = fin;
    c.beginPath(); c.moveTo(0, -24); c.quadraticCurveTo(-34, -4, 0, 26); c.closePath(); c.fill();
    if (!simple) {
      c.strokeStyle = 'rgba(0,0,0,0.18)'; c.lineWidth = 2;
      for (var j = -16; j <= 16; j += 8) { c.beginPath(); c.moveTo(0, j); c.lineTo(-18, j * 0.6); c.stroke(); }
    }
    c.restore();
    c.strokeStyle = col; c.lineWidth = 13;
    c.beginPath(); c.moveTo(6, 18); c.bezierCurveTo(16, 42, -2, 58, -18, 48); c.bezierCurveTo(-30, 40, -22, 26, -11, 32); c.stroke();
    c.lineWidth = 40;
    c.beginPath(); c.moveTo(10, -44); c.quadraticCurveTo(28, -12, 8, 24); c.stroke();
    c.strokeStyle = belly; c.lineWidth = 16;
    c.beginPath(); c.moveTo(20, -38); c.quadraticCurveTo(36, -12, 18, 20); c.stroke();
    if (!simple) {
      c.strokeStyle = 'rgba(120,60,0,0.25)'; c.lineWidth = 2;
      for (var b = -30; b <= 14; b += 11) { c.beginPath(); c.moveTo(14 + (b > -10 ? 4 : 0), b); c.lineTo(34, b + 2); c.stroke(); }
    }
    c.fillStyle = col;
    c.beginPath(); c.ellipse(14, -58, 20, 16, 0.2, 0, 6.3); c.fill();
    c.strokeStyle = col; c.lineWidth = 10;
    c.beginPath(); c.moveTo(28, -56); c.lineTo(46, -53); c.stroke();
    c.fillStyle = col;
    c.beginPath(); c.moveTo(2, -70); c.lineTo(6, -84); c.lineTo(12, -72); c.lineTo(18, -86); c.lineTo(22, -72); c.closePath(); c.fill();
    c.fillStyle = fin;
    c.save(); c.translate(18, -42); c.rotate(Math.sin(tt * 16) * 0.35);
    c.beginPath(); c.ellipse(-6, 0, 10, 5, 0, 0, 6.3); c.fill(); c.restore();
    if (!simple) {
      c.fillStyle = '#fff'; c.strokeStyle = '#2b1b14'; c.lineWidth = 2;
      c.beginPath(); c.arc(14, -60, 9, 0, 6.3); c.fill(); c.stroke();
      c.fillStyle = '#111';
      c.beginPath(); c.arc(14 + Math.cos(tt * 5 + ph) * 3.5, -60 + Math.sin(tt * 5 + ph) * 3.5, 4.5, 0, 6.3); c.fill();
    }
  }

  function drawSea(c, h, P) {
    var fallen = ep.key === 'sea' && P.tt >= ep.stopT;
    var st = ep.key === 'sea' ? Math.min(P.tt, ep.stopT) : P.tt;
    seaBody(c, st, h.color, h.belly, '#ffd36b', false, h.ph);
    if (fallen) {
      var open = eout((P.tt - (ep.stopT + 0.8)) / 0.3);
      if (open > 0) {
        c.fillStyle = '#7a2f12';
        c.beginPath(); c.ellipse(27, -10, 11 * open + 1, 22 * open + 1, 0.1, 0, 6.3); c.fill();
        c.strokeStyle = '#ffd08a'; c.lineWidth = 3; c.stroke();
      }
      c.fillStyle = '#ffd23f'; c.strokeStyle = '#a36a00'; c.lineWidth = 1.5;
      for (var k = 0; k < 3; k++) {
        var ang = P.tt * 6 + k * 2.09;
        starShape(c, 14 + Math.cos(ang) * 28, -92 + Math.sin(ang) * 8, 7);
        c.fill(); c.stroke();
      }
    }
  }

  var PIX = [

      cam.cx = x1 * (1 - b) + 800 * b;
      cam.cy = y1 * (1 - b) + 520 * b;
    } else if (e.key === 'pixel') {
      if (t >= e.C) {
        an = anchor(star, 9 * CELL, 7 * CELL);
        u = eio((t - e.C) / (e.D - e.C));

      cam.cx = W / 2 + (an.x - W / 2) * u; cam.cy = H / 2 + (an.y - H / 2) * u; cam.S = 1 + 3.2 * u;

  function capFor(t) {

      if (t < e.stopT + 0.9) return '海馬跌倒了！';

      if (t < e.crossAll) return '裁判：（默默吞口水）';

      if (t < B - 0.9) return '它瞬間移動了';

      if (t < e.E) return '掃描中…';

    clock.textContent = fmt(t) + ' / ' + fmt(ep.END);
  }

  function select(i) {
    build(i);
    t = 0; playing = true;
    seek.max = String(Math.round(ep.END * 100));
    Array.prototype.forEach.call(tabs.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(parseInt(b.getAttribute('data-ep'), 10) === i));
    });
    syncUI();
  }

  tabs.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (b) select(parseInt(b.getAttribute('data-ep'), 10));
  });
  playBtn.addEventListener('click', function () {
    if (t >= ep.END) { t = 0; playing = true; } else { playing = !playing; }
    syncUI();
  });
  replayBtn.addEventListener('click', function () { t = 0; playing = true; syncUI(); });
  seek.addEventListener('input', function () { t = clamp(parseInt(seek.value, 10) / 100, 0, ep.END); syncUI(); });

  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (playing) {
      t = Math.min(ep.END, t + dt);
      if (t >= ep.END) playing = false;
    }
    render(t);
    syncUI();
    requestAnimationFrame(frame);
  }

  select(0);
  tabs.style.display='none';
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    t = ep.END; playing = false;
  }
  requestAnimationFrame(frame);
})();
</script>
